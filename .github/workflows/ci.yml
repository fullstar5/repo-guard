name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      NEON_POSTGRES_URL: postgresql://user:pass@localhost/ci
      UPSTASH_REDIS_REST_URL: https://example.com
      UPSTASH_REDIS_REST_TOKEN: ci
      GITHUB_CLIENT_ID: ci
      GITHUB_CLIENT_SECRET: ci
      GITHUB_REDIRECT_URI: http://localhost:8000/auth/github/callback
      GITHUB_WEBHOOK_SECRET: ci-webhook-secret-at-least-32-chars
      FRONTEND_URL: http://localhost:3000
      GITHUB_OAUTH_SCOPE: "read:user user:email repo"
      OAUTH_STATE_COOKIE_NAME: codeguard_oauth_state
      COOKIE_SECURE: "false"
      JWT_SECRET_KEY: ci-jwt-secret-key-at-least-32-chars
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      OPEN_ROUTER_API_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Alembic single head
        run: |
          heads="$(alembic heads)"
          echo "$heads"
          test "$(echo "$heads" | wc -l)" -eq 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: /api
      API_ORIGIN: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile backend/